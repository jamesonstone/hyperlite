name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check vet test test-race build

  macos:
    name: macOS validation
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make macos-test macos-build
      - run: codesign --verify --deep --strict build/Hyperlite.app
